<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <rect width="36" height="36" rx="9" fill="#09090b"/>
  <!-- Secondary Background Orbit (Thin, lighter continuous line) -->
  <ellipse cx="18" cy="18" rx="13.8" ry="5.4" transform="rotate(34 18 18)" stroke="#f4f4f5" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <!-- Primary Foreground Orbit (Bold, prominent continuous line) -->
  <ellipse cx="18" cy="18" rx="14.2" ry="5.6" transform="rotate(-26 18 18)" stroke="#f4f4f5" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Central Core Nucleus -->
  <circle cx="18" cy="18" r="3.6" fill="#f4f4f5"/>
  <!-- Orbiting Satellite Node -->
  <circle cx="30.6" cy="11.8" r="2.2" fill="#f4f4f5"/>
</svg>