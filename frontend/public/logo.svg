<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <!-- Background Gradient for Core -->
    <radialGradient id="orbitCore" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="orbitRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="orbitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Orbit Ellipse (Back arc) -->
  <ellipse
    cx="18"
    cy="18"
    rx="15"
    ry="6.5"
    transform="rotate(-28 18 18)"
    stroke="url(#orbitRing)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-dasharray="72 24"
    opacity="0.85"
  />

  <!-- Central Planet Core -->
  <circle cx="18" cy="18" r="7.5" fill="url(#orbitCore)" filter="url(#orbitGlow)" />

  <!-- Inner Core Highlight -->
  <circle cx="16" cy="16" r="2.2" fill="#93c5fd" opacity="0.6" />

  <!-- Outer Orbit Ellipse (Front crossing arc) -->
  <ellipse
    cx="18"
    cy="18"
    rx="15"
    ry="6.5"
    transform="rotate(-28 18 18)"
    stroke="url(#orbitRing)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-dasharray="32 64"
    stroke-dashoffset="36"
  />

  <!-- Orbiting Satellite Node -->
  <circle cx="29" cy="12" r="2.2" fill="#38bdf8" filter="url(#orbitGlow)" />
  <circle cx="29" cy="12" r="1.2" fill="#ffffff" />
</svg>
